<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>지뢰찾기</title>
  <style>
    :root {
      --panel: #c0c0c0;
      --dark: #808080;
      --darker: #404040;
      --light: #fff;
      --blue: #0000ff;
      --green: #008000;
      --red: #ff0000;
      --navy: #000080;
      --maroon: #800000;
      --teal: #008080;
      --gray: #808080;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      margin: 0;
      padding: 24px 12px;
      color: #111;
      background: #008080;
      font-family: "Courier New", monospace;
    }

    .game {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: 10px;
      background: var(--panel);
      border-top: 3px solid var(--light);
      border-left: 3px solid var(--light);
      border-right: 3px solid var(--darker);
      border-bottom: 3px solid var(--darker);
    }

    .titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 7px;
      color: #fff;
      background: #000080;
      font-family: Arial, sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .difficulty {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 10px 0;
      font-family: Arial, sans-serif;
      font-size: 0.82rem;
    }

    select,
    button {
      font: inherit;
    }

    select {
      min-height: 28px;
      padding: 2px 22px 2px 6px;
      border: 2px inset var(--panel);
      background: #fff;
    }

    .dashboard {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-top: 3px solid var(--darker);
      border-left: 3px solid var(--darker);
      border-right: 3px solid var(--light);
      border-bottom: 3px solid var(--light);
    }

    .counter {
      min-width: 76px;
      padding: 3px 4px 1px;
      color: #ff0000;
      background: #190000;
      border: 2px inset var(--panel);
      font-family: Impact, "Arial Black", sans-serif;
      font-size: 1.8rem;
      letter-spacing: 2px;
      line-height: 1;
      text-align: center;
      text-shadow: 1px 1px #600;
    }

    .timer { justify-self: end; }

    .face {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      padding: 0;
      background: var(--panel);
      border-top: 3px solid var(--light);
      border-left: 3px solid var(--light);
      border-right: 3px solid var(--darker);
      border-bottom: 3px solid var(--darker);
      font-size: 1.55rem;
      line-height: 1;
      cursor: pointer;
    }

    .face:active,
    .face.pressed {
      border-top-color: var(--darker);
      border-left-color: var(--darker);
      border-right-color: var(--light);
      border-bottom-color: var(--light);
    }

    .board-frame {
      max-width: 100%;
      margin-top: 10px;
      padding: 6px;
      overflow: auto;
      border-top: 3px solid var(--darker);
      border-left: 3px solid var(--darker);
      border-right: 3px solid var(--light);
      border-bottom: 3px solid var(--light);
    }

    .board {
      display: grid;
      width: max-content;
      gap: 0;
      margin: 0 auto;
      background: var(--darker);
    }

    .cell {
      display: grid;
      width: 27px;
      height: 27px;
      place-items: center;
      padding: 0;
      border: 3px outset var(--panel);
      background: var(--panel);
      color: #000;
      font-family: Arial, sans-serif;
      font-size: 1rem;
      font-weight: 900;
      line-height: 1;
      cursor: pointer;
      user-select: none;
    }

    .cell:focus-visible,
    .face:focus-visible,
    select:focus-visible { outline: 2px dotted #000; outline-offset: -5px; }
    .cell.revealed { border: 1px solid var(--dark); cursor: default; }
    .cell.flagged { color: #d00; font-size: 1.05rem; }
    .cell.mine { color: #000; background: #ddd; }
    .cell.exploded { background: #f00; }
    .cell.wrong-flag { color: #000; background: #eee; }
    .cell[data-number="1"] { color: var(--blue); }
    .cell[data-number="2"] { color: var(--green); }
    .cell[data-number="3"] { color: var(--red); }
    .cell[data-number="4"] { color: var(--navy); }
    .cell[data-number="5"] { color: var(--maroon); }
    .cell[data-number="6"] { color: var(--teal); }
    .cell[data-number="7"] { color: #000; }
    .cell[data-number="8"] { color: var(--gray); }

    .status {
      min-height: 1.3em;
      margin: 9px 2px 0;
      font-family: Arial, sans-serif;
      font-size: 0.8rem;
      text-align: center;
    }

    .confetti {
      position: fixed;
      z-index: 5;
      top: -12px;
      width: 8px;
      height: 14px;
      pointer-events: none;
      animation: fall 1.9s ease-in forwards;
    }

    @keyframes fall {
      to { transform: translate3d(var(--drift), 105vh, 0) rotate(720deg); opacity: 0; }
    }

    @media (max-width: 480px) {
      body { padding: 10px 5px; }
      .cell { width: 25px; height: 25px; }
      .counter { min-width: 68px; font-size: 1.55rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .confetti { animation-duration: 0.01ms; }
    }
  </style>
</head>
<body>
  <main class="game" aria-label="클래식 지뢰찾기 게임">
    <div class="titlebar"><span>지뢰찾기</span><span aria-hidden="true">MINESWEEPER</span></div>
    <div class="difficulty">
      <label for="difficulty">난이도</label>
      <select id="difficulty">
        <option value="beginner">초급 9 x 9 · 10개</option>
        <option value="intermediate">중급 16 x 16 · 40개</option>
        <option value="expert">고급 30 x 16 · 99개</option>
      </select>
    </div>
    <section class="dashboard" aria-label="게임 정보">
      <div id="mine-counter" class="counter" aria-label="남은 지뢰 수">010</div>
      <button id="face" class="face" type="button" aria-label="게임 다시 시작">🙂</button>
      <div id="timer" class="counter timer" aria-label="경과 시간">000</div>
    </section>
    <div class="board-frame">
      <div id="board" class="board" role="grid" aria-label="지뢰찾기 게임판"></div>
    </div>
    <p id="status" class="status" role="status">첫 칸을 열어 게임을 시작하세요.</p>
  </main>

  <script>
    var LEVELS = {
      beginner: { rows: 9, columns: 9, mines: 10 },
      intermediate: { rows: 16, columns: 16, mines: 40 },
      expert: { rows: 16, columns: 30, mines: 99 }
    };
    var DIRECTIONS = [];
    [-1, 0, 1].forEach(function (row) {
      [-1, 0, 1].forEach(function (column) {
        if (row || column) DIRECTIONS.push([row, column]);
      });
    });
    var boardElement = document.querySelector('#board');
    var difficultyElement = document.querySelector('#difficulty');
    var mineCounterElement = document.querySelector('#mine-counter');
    var timerElement = document.querySelector('#timer');
    var faceElement = document.querySelector('#face');
    var statusElement = document.querySelector('#status');
    var state;

    function createState(levelName) {
      var level = LEVELS[levelName];
      var cells = [];
      for (var cellIndex = 0; cellIndex < level.rows * level.columns; cellIndex += 1) {
        cells.push({ index: cellIndex, mine: false, adjacent: 0, revealed: false, flagged: false, exploded: false });
      }
      return {
        levelName: levelName,
        rows: level.rows,
        columns: level.columns,
        mines: level.mines,
        cells: cells,
        phase: 'ready',
        elapsed: 0,
        timerId: null,
        pressed: false
      };
    }

    function indexAt(row, column) {
      return row * state.columns + column;
    }

    function coordinates(index) {
      return [Math.floor(index / state.columns), index % state.columns];
    }

    function neighbors(index) {
      var coordinatesForCell = coordinates(index);
      var row = coordinatesForCell[0];
      var column = coordinatesForCell[1];
      var adjacentCells = [];
      DIRECTIONS.forEach(function (direction) {
        var rowOffset = direction[0];
        var columnOffset = direction[1];
        var nextRow = row + rowOffset;
        var nextColumn = column + columnOffset;
        if (nextRow >= 0 && nextRow < state.rows && nextColumn >= 0 && nextColumn < state.columns) {
          adjacentCells.push(state.cells[indexAt(nextRow, nextColumn)]);
        }
      });
      return adjacentCells;
    }

    function placeMines(firstIndex) {
      var protectedIndexes = {};
      protectedIndexes[firstIndex] = true;
      neighbors(firstIndex).forEach(function (cell) { protectedIndexes[cell.index] = true; });
      var candidates = state.cells.filter(function (cell) { return !protectedIndexes[cell.index]; });
      for (var index = candidates.length - 1; index > 0; index -= 1) {
        var swapIndex = Math.floor(Math.random() * (index + 1));
        var temporaryCell = candidates[index];
        candidates[index] = candidates[swapIndex];
        candidates[swapIndex] = temporaryCell;
      }
      candidates.slice(0, state.mines).forEach(function (cell) { cell.mine = true; });
      state.cells.forEach(function (cell) {
        cell.adjacent = neighbors(cell.index).filter(function (neighbor) { return neighbor.mine; }).length;
      });
    }

    function formatCounter(value) {
      var text = String(Math.max(-99, Math.min(999, value)));
      while (text.length < 3) text = '0' + text;
      return text;
    }

    function updateCounters() {
      mineCounterElement.textContent = formatCounter(state.mines - state.cells.filter(function (cell) { return cell.flagged; }).length);
      timerElement.textContent = formatCounter(state.elapsed);
    }

    function setFace(face) { faceElement.textContent = face; }

    function renderBoard() {
      boardElement.style.gridTemplateColumns = 'repeat(' + state.columns + ', 27px)';
      boardElement.innerHTML = '';
      state.cells.forEach(function (cell) {
        var element = document.createElement('button');
        element.type = 'button';
        element.className = 'cell';
        element.setAttribute('data-index', cell.index);
        element.setAttribute('role', 'gridcell');
        element.addEventListener('click', function () { openCell(cell.index); });
        element.addEventListener('contextmenu', function (event) {
          event.preventDefault();
          toggleFlag(cell.index);
        });
        boardElement.appendChild(element);
      });
      renderCells();
    }

    function renderCells() {
      state.cells.forEach(function (cell) {
        var element = boardElement.children[cell.index];
        if (!element) return;
        element.className = 'cell';
        element.textContent = '';
        element.removeAttribute('data-number');
        if (cell.flagged && !cell.revealed) {
          element.classList.add('flagged');
          element.textContent = '🚩';
          element.setAttribute('aria-label', (cell.index + 1) + '번 칸, 깃발');
        } else if (cell.revealed) {
          element.classList.add('revealed');
          if (cell.mine) {
            element.classList.add(cell.exploded ? 'exploded' : 'mine');
            element.textContent = '💣';
            element.setAttribute('aria-label', (cell.index + 1) + '번 칸, 지뢰');
          } else if (cell.adjacent) {
            element.setAttribute('data-number', cell.adjacent);
            element.textContent = cell.adjacent;
            element.setAttribute('aria-label', (cell.index + 1) + '번 칸, 주변 지뢰 ' + cell.adjacent + '개');
          } else {
            element.setAttribute('aria-label', (cell.index + 1) + '번 칸, 빈 칸');
          }
        } else {
          element.setAttribute('aria-label', (cell.index + 1) + '번 칸, 닫힌 칸');
        }
        if (cell.wrongFlag) {
          element.classList.add('wrong-flag');
          element.textContent = '❌';
          element.setAttribute('aria-label', (cell.index + 1) + '번 칸, 잘못된 깃발');
        }
      });
      updateCounters();
    }

    function startTimer() {
      state.timerId = window.setInterval(function () {
        state.elapsed = Math.min(999, state.elapsed + 1);
        updateCounters();
        if (state.elapsed === 999) stopTimer();
      }, 1000);
    }

    function stopTimer() {
      if (!state) return;
      window.clearInterval(state.timerId);
      state.timerId = null;
    }

    function revealSafeCells(startIndex) {
      var queue = [startIndex];
      var visited = {};
      while (queue.length) {
        var index = queue.shift();
        if (visited[index]) continue;
        visited[index] = true;
        var cell = state.cells[index];
        if (cell.flagged || cell.mine || cell.revealed) continue;
        cell.revealed = true;
        if (cell.adjacent === 0) {
          neighbors(index).forEach(function (neighbor) {
            if (!neighbor.mine && !neighbor.flagged && !neighbor.revealed) queue.push(neighbor.index);
          });
        }
      }
    }

    function openCell(index) {
      if (state.phase === 'lost' || state.phase === 'won') return;
      var cell = state.cells[index];
      if (cell.flagged) return;
      if (state.phase === 'ready') {
        placeMines(index);
        state.phase = 'playing';
        startTimer();
      }
      if (cell.revealed) {
        chord(index);
      } else if (cell.mine) {
        cell.exploded = true;
        loseGame();
      } else {
        revealSafeCells(index);
        checkWin();
      }
      renderCells();
    }

    function chord(index) {
      var cell = state.cells[index];
      if (!cell.revealed || !cell.adjacent) return;
      var adjacentCells = neighbors(index);
      var flagCount = adjacentCells.filter(function (neighbor) { return neighbor.flagged; }).length;
      if (flagCount !== cell.adjacent) return;
      adjacentCells.filter(function (neighbor) { return !neighbor.flagged && !neighbor.revealed; }).forEach(function (neighbor) {
        if (neighbor.mine) {
          neighbor.exploded = true;
          loseGame();
        } else {
          revealSafeCells(neighbor.index);
        }
      });
      if (state.phase === 'playing') checkWin();
    }

    function toggleFlag(index) {
      if (state.phase === 'lost' || state.phase === 'won') return;
      var cell = state.cells[index];
      if (cell.revealed) return;
      cell.flagged = !cell.flagged;
      renderCells();
    }

    function loseGame() {
      state.phase = 'lost';
      stopTimer();
      setFace('😵');
      state.cells.forEach(function (cell) {
        if (cell.mine) cell.revealed = true;
        if (cell.flagged && !cell.mine) cell.wrongFlag = true;
      });
      statusElement.textContent = '지뢰를 밟았습니다. 다시 시작해 보세요.';
    }

    function checkWin() {
      var safeCells = state.cells.filter(function (cell) { return !cell.mine; });
      if (!safeCells.every(function (cell) { return cell.revealed; })) return;
      state.phase = 'won';
      stopTimer();
      setFace('😎');
      state.cells.filter(function (cell) { return cell.mine; }).forEach(function (cell) { cell.flagged = true; });
      statusElement.textContent = '축하합니다! 모든 지뢰를 찾았습니다.';
      launchConfetti();
    }

    function launchConfetti() {
      var colors = ['#ff0000', '#0000ff', '#008000', '#ffcc00', '#800080'];
      for (var index = 0; index < 72; index += 1) {
        var piece = document.createElement('i');
        piece.className = 'confetti';
        piece.style.left = (Math.random() * 100) + 'vw';
        piece.style.backgroundColor = colors[index % colors.length];
        piece.style.setProperty('--drift', (Math.random() * 160 - 80) + 'px');
        piece.style.animationDelay = (Math.random() * 0.5) + 's';
        document.body.appendChild(piece);
        window.setTimeout(function () { piece.parentNode && piece.parentNode.removeChild(piece); }, 2500);
      }
    }

    function resetGame(levelName) {
      levelName = levelName || difficultyElement.value;
      stopTimer();
      state = createState(levelName);
      setFace('🙂');
      statusElement.textContent = '첫 칸을 열어 게임을 시작하세요.';
      renderBoard();
    }

    faceElement.addEventListener('click', function () { resetGame(); });
    faceElement.addEventListener('pointerdown', function () {
      faceElement.classList.add('pressed');
      if (state.phase === 'ready' || state.phase === 'playing') setFace('😲');
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (eventName) {
      faceElement.addEventListener(eventName, function () {
        faceElement.classList.remove('pressed');
        if (state.phase === 'ready' || state.phase === 'playing') setFace('🙂');
      });
    });
    difficultyElement.addEventListener('change', function () { resetGame(); });
    resetGame();
  </script>
</body>
</html>
